name: Lint and test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pinned for reproducible builds. uv >= 0.13 can't extract the prettytable 0.7.2 sdist
          # required by cliff 3.2: keep an older uv until cliff is upgraded.
          version: "0.9.30"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check --select I --diff && uv run ruff check --diff

      - name: Format
        run: uv run ruff format --diff

      - name: Type check
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest
