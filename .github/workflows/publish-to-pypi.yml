name: Publish 📦

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    name: Build and publish 📦 to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pinned for reproducible builds. uv >= 0.13 can't extract the prettytable 0.7.2 sdist
          # required by cliff 3.2: keep an older uv until cliff is upgraded.
          version: "0.9.30"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build a binary wheel and a source tarball
        run: uv publish --index=testpypi
